[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-math-classifier"
version = "0.1.0"
description = "Leakage-checked Russian educational task classification on Apple Silicon"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.6.1", "joblib==1.4.2"]

[project.optional-dependencies]
bert = ["torch==2.6.0", "transformers==4.51.3", "safetensors==0.5.3"]

notebook = ["jupyterlab>=4,<5", "nbclient>=0.10,<1"]

[project.scripts]
pmc = "pmc.cli:main"

[tool.setuptools.packages.find]
include = ["pmc*"]
